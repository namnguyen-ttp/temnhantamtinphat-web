name: Dang web len GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tai anh GoDEX ve may chu
        run: python fetch_godex_images.py
      - name: Lay thong so GoDEX tu namnguyeninfotech.com
        run: pip install beautifulsoup4 && python fetch_godex_specs.py
      - name: Ghep banner GoDEX tu anh that
        run: pip install pillow && python make_godex_banner.py
      - name: Sinh website
        run: LOCAL_GODEX=1 python build.py && echo "temnhantamtinphat.com" > dist/CNAME && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
